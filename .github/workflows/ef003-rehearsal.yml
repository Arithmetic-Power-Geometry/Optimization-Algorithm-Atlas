name: EF003 Rehearsal
on:
  workflow_dispatch:
  push:
    paths: ['experiments/triggers/ef003-rehearsal.trigger']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements-benchmarks.txt
      - run: python experiments/test_ef003_metadata_modes.py
      - run: python experiments/run_bbob_publication_ef003.py --dimension 2 --functions 1-1 --instances 1 --seeds 11 --label EF003-REHEARSAL --mode rehearsal
      - name: Validate rehearsal metadata and counters
        run: |
          python - <<'PY'
          import csv,json
          p="artifacts/publication/EF003-REHEARSAL/checkpoints.csv"
          r=list(csv.DictReader(open(p)))
          assert r and {x["freeze_id"] for x in r}=={"EF003"}
          assert {x["run_status"] for x in r}=={"REHEARSAL_ONLY"}
          assert {x["paper_evidence"] for x in r}=={"NO"}
          assert all(x["final_recorder_evals"]==x["final_coco_evals"] for x in r)
          q=json.load(open("artifacts/publication/EF003-REHEARSAL/provenance.json"))
          assert q["mode"]=="rehearsal" and q["parent_freeze"]=="EF002"
          print("EF003 REHEARSAL VALID",len(r),"rows")
          PY
      - run: python experiments/run_bbob_publication_ef003.py --dimension 2 --functions 1-1 --instances 1 --seeds 11 --label EF003-PUBLICATION-MODE-TEST --mode publication
      - name: Validate publication metadata
        run: |
          python - <<'PY'
          import csv,json
          r=list(csv.DictReader(open("artifacts/publication/EF003-PUBLICATION-MODE-TEST/checkpoints.csv")))
          assert r and {x["run_status"] for x in r}=={"RUN_COMPLETE_UNVERIFIED"}
          assert {x["paper_evidence"] for x in r}=={"NO_UNTIL_PROMOTED"}
          assert all(x["final_recorder_evals"]==x["final_coco_evals"] for x in r)
          q=json.load(open("artifacts/publication/EF003-PUBLICATION-MODE-TEST/provenance.json"))
          assert q["mode"]=="publication" and q["paper_evidence"]=="NO_UNTIL_PROMOTED"
          print("EF003 PUBLICATION MODE VALID",len(r),"rows")
          PY
