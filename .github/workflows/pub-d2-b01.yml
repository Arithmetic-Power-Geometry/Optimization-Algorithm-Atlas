name: PUB-D2 B01

on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/run_pub_d2_b01.py'
      - 'experiments/validate_pub_d2_b01.py'
      - 'experiments/triggers/pub-d2-b01.trigger'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen stack
        run: pip install -r requirements-benchmarks.txt
      - name: Validate EF001
        run: python scripts/validate_execution_freeze.py
      - name: Capture environment
        run: python scripts/capture_environment.py
      - name: Execute first publication batch
        run: python experiments/run_pub_d2_b01.py
      - name: Validate raw integrity
        run: python experiments/validate_pub_d2_b01.py
      - name: Build descriptive audit
        run: |
          python experiments/summarize_pub_d2_b01.py
          python experiments/validate_pub_d2_b01_summary.py
      - uses: actions/upload-artifact@v4
        with:
          name: PUB-D2-B01-EF001
          path: |
            artifacts/publication/PUB-D2/D2-B01_raw.csv
            artifacts/publication/PUB-D2/D2-B01_provenance.json
            artifacts/publication/PUB-D2/D2-B01_descriptive_summary.csv
            artifacts/publication/PUB-D2/D2-B01_termination_summary.csv
            artifacts/validation/environment.json
