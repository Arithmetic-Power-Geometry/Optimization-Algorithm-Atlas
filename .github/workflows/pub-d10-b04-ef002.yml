name: PUB-D10 B04 EF002
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/triggers/pub-d10-b04.trigger'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-benchmarks.txt
      - run: python scripts/validate_execution_freeze.py
      - name: Run B04
        run: python experiments/run_bbob_publication_ef002.py --dimension 10 --functions 19-24 --instances 1,2,3,4,5 --seeds 11,23,37 --label PUB-D10-B04
      - uses: actions/upload-artifact@v4
        with:
          name: PUB-D10-B04-EF002
          path: |
            artifacts/publication/PUB-D10-B04/
            exdata/PUB-D10-B04_COCO/
