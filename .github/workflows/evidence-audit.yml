name: Evidence Audit
on:
  push:
    paths:
      - "evidence/**"
      - "census/**"
      - "publication/**"
      - "app/**"
      - "app_pages/**"
      - "app_utils/**"
      - "streamlit_app.py"
      - "requirements.txt"
      - "gap_registry/**"
      - "benchmarks/**"
      - "experiments/**"
      - "schemas/**"
      - "scripts/**"
      - "agents/**"
      - "protocol/**"
      - ".github/workflows/evidence-audit.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate evidence ledgers
        run: python scripts/validate_registry.py
      - name: Validate Apache license
        run: python scripts/validate_license.py
      - name: Run pre-publication pilot
        run: |
          python experiments/validate_pilot.py
          python experiments/summarize_pilot.py
      - name: Run deterministic calibration
        run: |
          python experiments/validate_calibration.py
          python experiments/summarize_calibration.py
      - name: Build validation provenance
        run: python scripts/build_validation_manifest.py
      - name: Validate Streamlit app syntax
        run: python -m py_compile streamlit_app.py app_pages/*.py app_utils/*.py
      - name: Validate pre-paper gate
        run: python scripts/validate_pre_paper_gate.py
      - name: Build pre-paper dashboard
        run: python scripts/build_pre_paper_dashboard.py
      - name: Validate optimization census
        run: python scripts/validate_census.py
      - name: Generate census coverage
        run: python scripts/build_census_report.py
      - name: Generate Phase-1 summary
        run: python scripts/build_phase1_report.py
      - name: Generate candidate gap atlas
        run: python scripts/build_gap_atlas.py
      - name: Generate mechanism similarity
        run: python scripts/build_similarity_matrix.py
      - name: Generate evidence status matrix
        run: python scripts/build_status_artifact.py
      - name: Generate closest-review matrix
        run: python scripts/build_closest_review_artifact.py
      - name: Generate publication readiness dashboard
        run: python scripts/build_publication_dashboard.py
      - name: Show generated artifacts
        run: |
          cat artifacts/validation/pilot_summary.md
          cat artifacts/validation/calibration_summary.md
          cat artifacts/tables/pre_paper_dashboard.md
          cat artifacts/tables/census_coverage.md
          cat artifacts/tables/phase1_registry_summary.md
          cat artifacts/tables/candidate_gap_atlas.md
          cat artifacts/tables/mechanism_similarity_initial.md
          cat artifacts/tables/evidence_status_matrix.md
          cat artifacts/tables/closest_review_matrix.md
          cat artifacts/tables/publication_readiness.md
      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase1-evidence-audit
          path: |
            artifacts/validation/provenance_manifest.json
            artifacts/validation/pilot_raw.csv
            artifacts/validation/pilot_traces.csv
            artifacts/validation/pilot_summary.md
            artifacts/validation/calibration_raw.csv
            artifacts/validation/calibration_summary.md
            artifacts/tables/pre_paper_dashboard.md
            artifacts/tables/census_coverage.md
            artifacts/tables/phase1_registry_summary.md
            artifacts/tables/candidate_gap_atlas.md
            artifacts/tables/mechanism_similarity_initial.md
            artifacts/tables/evidence_status_matrix.md
            artifacts/tables/closest_review_matrix.md
            artifacts/tables/publication_readiness.md
