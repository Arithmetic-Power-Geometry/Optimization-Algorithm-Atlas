name: Evidence Audit
on:
  push:
    paths:
      - "evidence/**"
      - "gap_registry/**"
      - "benchmarks/**"
      - "experiments/**"
      - "schemas/**"
      - "scripts/**"
      - "agents/**"
      - "protocol/**"
      - ".github/workflows/evidence-audit.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate evidence ledgers
        run: python scripts/validate_registry.py
      - name: Generate Phase-1 summary
        run: python scripts/build_phase1_report.py
      - name: Generate candidate gap atlas
        run: python scripts/build_gap_atlas.py
      - name: Generate evidence status matrix
        run: python scripts/build_status_artifact.py
      - name: Generate closest-review matrix
        run: python scripts/build_closest_review_artifact.py
      - name: Generate publication readiness dashboard
        run: python scripts/build_publication_dashboard.py
      - name: Show generated artifacts
        run: |
          cat artifacts/tables/phase1_registry_summary.md
          cat artifacts/tables/candidate_gap_atlas.md
          cat artifacts/tables/evidence_status_matrix.md
          cat artifacts/tables/closest_review_matrix.md
          cat artifacts/tables/publication_readiness.md
      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase1-evidence-audit
          path: |
            artifacts/tables/phase1_registry_summary.md
            artifacts/tables/candidate_gap_atlas.md
            artifacts/tables/evidence_status_matrix.md
            artifacts/tables/closest_review_matrix.md
            artifacts/tables/publication_readiness.md
