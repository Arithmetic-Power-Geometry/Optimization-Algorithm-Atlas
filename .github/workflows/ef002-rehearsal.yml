name: EF002 Production Rehearsal
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/triggers/ef002-rehearsal.trigger'
jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-benchmarks.txt
      - name: Compile production path
        run: python -m py_compile experiments/run_bbob_publication_ef002.py experiments/validate_ef002_rehearsal.py
      - name: Run real BBOB rehearsal
        run: python experiments/run_bbob_publication_ef002.py --dimension 2 --functions 1-3 --instances 1 --seeds 11 --label EF002-REHEARSAL
      - name: Validate rehearsal
        run: python experiments/validate_ef002_rehearsal.py
      - uses: actions/upload-artifact@v4
        with:
          name: EF002-REHEARSAL
          path: artifacts/publication/EF002-REHEARSAL/
