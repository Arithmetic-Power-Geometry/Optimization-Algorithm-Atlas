name: EF003 PUB-D40 B02
on:
  workflow_dispatch:
  push:
    paths: ['experiments/triggers/ef003-d40-b02.trigger']
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements-benchmarks.txt
      - run: python scripts/validate_execution_freeze.py
      - run: python experiments/run_bbob_publication_ef003.py --dimension 40 --functions 7-12 --instances 1,2,3,4,5 --seeds 11,23,37 --label EF003-PUB-D40-B02 --mode publication
      - name: Validate
        run: |
          python - <<'PY'
          import csv
          r=list(csv.DictReader(open("artifacts/publication/EF003-PUB-D40-B02/checkpoints.csv")))
          assert len(r)==900
          assert {x["freeze_id"] for x in r}=={"EF003"}
          assert {x["run_status"] for x in r}=={"RUN_COMPLETE_UNVERIFIED"}
          assert {x["paper_evidence"] for x in r}=={"NO_UNTIL_PROMOTED"}
          assert all(x["final_recorder_evals"]==x["final_coco_evals"] for x in r)
          print("EF003 D40 B02 VALID")
          PY
      - uses: actions/upload-artifact@v4
        with: {name: EF003-PUB-D40-B02, path: 'artifacts/publication/EF003-PUB-D40-B02/'}
