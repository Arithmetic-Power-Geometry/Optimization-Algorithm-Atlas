name: PUB-D20 Merge Analysis EF002
on:
  workflow_dispatch:
  push:
    paths: ['experiments/triggers/pub-d20-merge-analysis.trigger']
jobs:
  merge-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dawidd6/action-download-artifact@v6
        with: {workflow: pub-d20-b01-ef002.yml, name: PUB-D20-B01-EF002, path: artifacts/publication/D20-DL/B01}
      - uses: dawidd6/action-download-artifact@v6
        with: {workflow: pub-d20-b02-ef002.yml, name: PUB-D20-B02-EF002, path: artifacts/publication/D20-DL/B02}
      - uses: dawidd6/action-download-artifact@v6
        with: {workflow: pub-d20-b03-ef002.yml, name: PUB-D20-B03-EF002, path: artifacts/publication/D20-DL/B03}
      - uses: dawidd6/action-download-artifact@v6
        with: {workflow: pub-d20-b04-ef002.yml, name: PUB-D20-B04-EF002, path: artifacts/publication/D20-DL/B04}
      - name: Stage
        run: |
          mkdir -p artifacts/publication/D20-STAGE
          for B in B01 B02 B03 B04; do
            L=PUB-D20-$B; mkdir -p artifacts/publication/D20-STAGE/$L
            F=$(find artifacts/publication/D20-DL/$B -name checkpoints.csv | head -1); test -n "$F"
            cp "$F" artifacts/publication/D20-STAGE/$L/checkpoints.csv
          done
      - run: python experiments/merge_pub_d20.py
      - run: python experiments/validate_pub_d20_merged.py
      - run: python experiments/summarize_pub_d20.py
      - name: Validate comparison
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          r=list(csv.DictReader(Path("artifacts/publication/PUB-D20/PUB-D20_function_checkpoint_summary.csv").open()))
          assert len(r)==288
          assert {int(x["function_id"]) for x in r}==set(range(1,25))
          assert {int(x["checkpoint"]) for x in r}=={2000,6000,20000}
          assert {x["algorithm"] for x in r}=={"RandomSearch","SciPy-DE","SciPy-NelderMead","pycma-CMAES"}
          print("PUB-D20 ANALYSIS VALID",len(r),"cells","unobserved",sum(x["cell_status"]=="UNOBSERVED" for x in r))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: PUB-D20-MERGED-ANALYSIS-EF002, path: artifacts/publication/PUB-D20/}
