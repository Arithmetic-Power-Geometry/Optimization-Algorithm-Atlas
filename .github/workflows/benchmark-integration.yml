name: Benchmark Integration

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "experiments/**"
      - "requirements-benchmarks.txt"
      - "scripts/capture_environment.py"
      - ".github/workflows/benchmark-integration.yml"
  workflow_dispatch:

jobs:
  standard-suite-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pinned benchmark stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-benchmarks.txt
      - name: Capture environment
        run: python scripts/capture_environment.py
      - name: Smoke test standard suites
        run: python benchmarks/smoke_standard_suites.py
      - name: Validate publication matrix
        run: python scripts/validate_publication_matrix.py
      - name: Upload integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-integration-evidence
          path: |
            artifacts/validation/environment_snapshot.json
            artifacts/validation/standard_suite_smoke.json
