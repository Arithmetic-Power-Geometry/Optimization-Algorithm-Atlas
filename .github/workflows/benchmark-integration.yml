name: Benchmark Integration

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "experiments/**"
      - "requirements-benchmarks.txt"
      - "scripts/capture_environment.py"
      - ".github/workflows/benchmark-integration.yml"
  workflow_dispatch:

jobs:
  standard-suite-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pinned benchmark stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-benchmarks.txt
      - name: Capture environment
        run: python scripts/capture_environment.py
      - name: Smoke test standard suites
        run: python benchmarks/smoke_standard_suites.py
      - name: Run maintained comparator acceptance
        run: python experiments/comparator_acceptance.py
      - name: Validate maintained comparator acceptance
        run: python scripts/validate_comparator_acceptance.py
      - name: Test recorder COCO invariant
        run: python experiments/test_recorder_coco_invariant.py
      - name: Test exact objective recorder
        run: python experiments/test_objective_recorder.py
      - name: Run anytime execution-engine smoke
        continue-on-error: true
        run: |
          python experiments/run_anytime_engine_smoke.py
          python experiments/validate_anytime_engine_smoke.py
      - name: Run common maintained-comparator BBOB acceptance
        run: python experiments/validate_common_bbob_acceptance.py
      - name: Run BBOB standard-suite validation
        run: |
          python experiments/validate_bbob_validation.py
          python experiments/summarize_bbob_validation.py
      - name: Validate publication matrix
        run: python scripts/validate_publication_matrix.py
      - name: Upload integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-integration-evidence
          path: |
            artifacts/validation/environment_snapshot.json
            artifacts/validation/comparator_acceptance.json
            artifacts/validation/common_bbob_acceptance_raw.csv
            artifacts/validation/anytime_engine_smoke.csv
            artifacts/validation/anytime_engine_smoke_provenance.json
            artifacts/validation/standard_suite_smoke.json
            artifacts/validation/bbob_validation_raw.csv
            artifacts/validation/bbob_validation_summary.md
