name: EF003 PUB-D5 Merge Analysis
on:
  workflow_dispatch:
  push:
    paths: ['experiments/triggers/ef003-d5-merge.trigger']
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dawidd6/action-download-artifact@v6
        with: {workflow: ef003-pub-d5-b01.yml, name: EF003-PUB-D5-B01, path: artifacts/ef003/D5/B01}
      - uses: dawidd6/action-download-artifact@v6
        with: {workflow: ef003-pub-d5-b02.yml, name: EF003-PUB-D5-B02, path: artifacts/ef003/D5/B02}
      - uses: dawidd6/action-download-artifact@v6
        with: {workflow: ef003-pub-d5-b03.yml, name: EF003-PUB-D5-B03, path: artifacts/ef003/D5/B03}
      - uses: dawidd6/action-download-artifact@v6
        with: {workflow: ef003-pub-d5-b04.yml, name: EF003-PUB-D5-B04, path: artifacts/ef003/D5/B04}
      - name: Merge validate compare
        run: |
          python - <<'PY'
          import csv,glob,statistics
          from pathlib import Path
          files=glob.glob("artifacts/ef003/D5/**/checkpoints.csv",recursive=True)
          assert len(files)==4,files
          rows=[]
          for f in files: rows+=list(csv.DictReader(open(f)))
          assert len(rows)==3600,len(rows)
          assert {r["freeze_id"] for r in rows}=={"EF003"}
          assert {r["run_status"] for r in rows}=={"RUN_COMPLETE_UNVERIFIED"}
          assert {r["paper_evidence"] for r in rows}=={"NO_UNTIL_PROMOTED"}
          assert {int(r["function_id"]) for r in rows}==set(range(1,25))
          assert {int(r["checkpoint"]) for r in rows}=={500,1500,5000}
          out=Path("artifacts/publication/EF003-PUB-D5");out.mkdir(parents=True,exist_ok=True)
          cols=list(rows[0]); w=csv.DictWriter(open(out/"checkpoints.csv","w",newline=""),fieldnames=cols);w.writeheader();w.writerows(rows)
          algs=["RandomSearch","SciPy-DE","SciPy-NelderMead","pycma-CMAES"]; cps=[500,1500,5000]
          summ=[]
          for a in algs:
           for fn in range(1,25):
            for cp in cps:
             rr=[r for r in rows if r["algorithm"]==a and int(r["function_id"])==fn and int(r["checkpoint"])==cp and r["checkpoint_observed"]=="True" and r["best_at_checkpoint"] not in ("","None")]
             vals=[float(r["best_at_checkpoint"]) for r in rr]
             summ.append({"algorithm":a,"function_id":fn,"checkpoint":cp,"n":len(vals),"median_best":statistics.median(vals) if vals else "","cell_status":"OBSERVED" if vals else "UNOBSERVED","evidence_state":"RUN_COMPLETE_UNVERIFIED"})
          assert len(summ)==288
          p=out/"function_checkpoint_summary.csv";w=csv.DictWriter(open(p,"w",newline=""),fieldnames=list(summ[0]));w.writeheader();w.writerows(summ)
          print("EF003 D5 MERGE VALID",len(rows),"rows",len(summ),"cells","unobserved",sum(x["cell_status"]=="UNOBSERVED" for x in summ))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: EF003-PUB-D5-MERGED-ANALYSIS, path: artifacts/publication/EF003-PUB-D5/}
